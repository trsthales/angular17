spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: false
server:
  port: 8080

# JWT configuration for local testing (replace in production)
security:
  jwt:
    # symmetric secret used to sign/verify HS256 tokens for local testing
    # MUST be at least 32 bytes for HS256 (Nimbus requirement). Change to a secure value in production.
    secret: "secret-change-me-for-production-0123456789abcd"
